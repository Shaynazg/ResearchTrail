# PostgreSQL 16 with the pgvector extension, for local development.
# Start:  docker compose --env-file .env.local up -d
# On the first start (empty volume) it runs db/researchtrail.sql,
# which creates the tables and loads the demo data.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: researchtrail-db
    environment:
      POSTGRES_DB: researchtrail
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - researchtrail-data:/var/lib/postgresql/data
      - ./db/researchtrail.sql:/docker-entrypoint-initdb.d/researchtrail.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d researchtrail"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  researchtrail-data:
